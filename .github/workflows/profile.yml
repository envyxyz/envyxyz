name: profile

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches: [main, claude/friendly-cerf-h54ty0]
    paths: ['scripts/**', 'assets/**', '.github/workflows/profile.yml']

permissions:
  contents: write
  issues: write

concurrency:
  group: profile

jobs:
  build:
    # play.py sweeps every open chess issue, so a run dropped by the concurrency queue loses nothing
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'chess|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install python-chess
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q chess==1.11.2
          echo /tmp/venv/bin >> "$GITHUB_PATH"

      - name: Play queued moves
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/play.py

      - name: Save the game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md game
          if ! git diff --cached --quiet; then
            git commit -qm 'Board: next move'
            git pull -q --rebase origin "$GITHUB_REF_NAME"
            git push -q origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Build cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build.py dist

      - name: Publish to the output branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init -q -b output
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Cards $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
